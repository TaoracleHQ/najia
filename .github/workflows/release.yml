name: Release

# Publishes when a version tag is pushed, e.g. `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which records in the public registry that
      # this exact tarball was built from this exact commit by this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm itself does the publishing; bun runs the checks and the build.
      # npm 11.5.1+ is required for trusted publishing (OIDC).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: Refuse to publish if the tag disagrees with package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$pkg" ]; then
            echo "tag $TAG does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Verify
        run: |
          bunx biome ci src test tools
          bun run typecheck
          bun test

      - run: bun run build

      # Trusted publishing: npm accepts the GitHub OIDC token from this exact
      # repository and workflow, so no NPM_TOKEN is stored anywhere. Provenance
      # is attached automatically.
      - name: Publish
        run: npm publish --access public
